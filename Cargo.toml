[package]
name = "wuwa-apr"
version = "2.0.0"
edition = "2021"
rust-version = "1.79"
description = "WuWa AutoPatchReboot - restarts Wuthering Waves after a patch (Windows OCR)"
license = "MIT"

[dependencies]
png = "0.17"
serde_json = "1"
tray-icon = "0.19"
winreg = "0.52"

[dependencies.windows]
version = "0.58"
features = [
    # WinRT: Windows.Media.Ocr
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    # Win32
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
